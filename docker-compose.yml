# Pile Nextcloud de l'École (étape 1, #8) : Nextcloud (Apache), MariaDB et Redis.
# Décisions : ADR-0001 #2, ADR-0002 #3, ADR-0003 #4, ADR-0004 #5.
# Toutes les valeurs propres au déploiement viennent de .env (voir .env.example).

# Environnement commun à Nextcloud et à son conteneur cron : les fichiers de
# configuration de l'image (redis, reverse proxy) lisent ces variables à
# chaque requête, y compris pour les tâches de fond.
x-nextcloud-environment: &nextcloud-environment
  MYSQL_HOST: db
  MYSQL_DATABASE: ${MYSQL_DATABASE}
  MYSQL_USER: ${MYSQL_USER}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD}
  NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
  NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
  NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_DOMAIN}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES}
  OVERWRITEPROTOCOL: https
  OVERWRITECLIURL: ${NEXTCLOUD_PUBLIC_URL}
  REDIS_HOST: redis
  REDIS_HOST_PASSWORD: ${REDIS_HOST_PASSWORD}
  PHP_UPLOAD_LIMIT: ${PHP_UPLOAD_LIMIT:-2G}
  PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-1G}

services:
  nextcloud:
    # Version majeure fixée : une mise à jour est un changement volontaire.
    image: nextcloud:35-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *nextcloud-environment
    # Seul service publié, sur l'interface et le port convenus avec le service
    # informatique : il ne doit être joignable que par le reverse proxy (#7).
    ports:
      - "${NEXTCLOUD_HTTP_BIND}:${NEXTCLOUD_HTTP_PORT}:80"
    volumes:
      - nextcloud:/var/www/html
      - nextcloud_data:/var/www/html/data
      # Configuration post-installation versionnée (groupes, liste blanche…).
      - ./nextcloud/post-installation:/docker-entrypoint-hooks.d/post-installation:ro
    networks:
      - interne
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost/status.php || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10m

  # Tâches de fond de Nextcloud en mode cron : même image, mêmes volumes.
  cron:
    image: nextcloud:35-apache
    restart: unless-stopped
    entrypoint: /cron.sh
    depends_on:
      nextcloud:
        condition: service_started
    environment: *nextcloud-environment
    volumes:
      - nextcloud:/var/www/html
      - nextcloud_data:/var/www/html/data
    networks:
      - interne

  db:
    image: mariadb:11.4
    restart: unless-stopped
    # Réglages exigés par Nextcloud (ADR-0001).
    command:
      - --transaction-isolation=READ-COMMITTED
      - --binlog-format=ROW
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db:/var/lib/mysql
    networks:
      - interne
    # Aucun port publié : MariaDB n'est joignable que par Nextcloud (ADR-0003).
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_HOST_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${REDIS_HOST_PASSWORD}
    volumes:
      - redis:/data
    networks:
      - interne
    # Aucun port publié : Redis n'est joignable que par Nextcloud (ADR-0003).
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  interne:

volumes:
  # Code de Nextcloud : disque local (ADR-0004).
  nextcloud:
  # Dossier de données (Documents des utilisateurs) : partage NFS de l'École (#6).
  nextcloud_data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NFS_SERVER},${NFS_MOUNT_OPTIONS:-nfsvers=4.1,rw,hard}"
      device: ":${NFS_EXPORT_PATH}"
  # Base de données : disque local, jamais sur NFS (ADR-0004).
  db:
  # Cache et verrous : disque local, persistance non critique.
  redis:
